name: codeclash-app
services:
  postgres:
    image: postgres:16.2
    environment:
      POSTGRES_DB: codeclash
      POSTGRES_USER: codeclash
      POSTGRES_PASSWORD: codeclash_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - app-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeclash -d codeclash"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  app-data:
