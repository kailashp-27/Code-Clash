x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - ./cgroup-fix.sh:/cgroup-fix.sh:ro
    entrypoint: ["/bin/bash", "/cgroup-fix.sh"]
    command: ["/api/docker-entrypoint.sh", "./scripts/server"]
    ports:
      - "2358:2358"
    privileged: true
    <<: *default-logging
    restart: always

  workers:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - ./cgroup-fix.sh:/cgroup-fix.sh:ro
    entrypoint: ["/bin/bash", "/cgroup-fix.sh"]
    command: ["/api/docker-entrypoint.sh", "./scripts/workers"]
    privileged: true
    <<: *default-logging
    restart: always

  db:
    image: postgres:16.2
    env_file: judge0.conf
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    <<: *default-logging
    restart: always

volumes:
  data:
